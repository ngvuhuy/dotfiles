# NTS-only time sources for chronyd.
#
# Installed by dotfiles/setup.sh to /etc/chrony.d/10-nts.conf, where it is
# picked up by the "include /etc/chrony.d/*.conf" line in /etc/chrony.conf.
#
# All three servers use Network Time Security (NTS).
server ntp3.fau.de iburst nts
server time.cloudflare.com iburst nts
server paris.time.system76.com iburst nts

# Any unauthenticated NTP source (e.g. one handed out over DHCP, or a pool)
# is automatically marked "noselect" and can never be used to set the clock.
authselectmode require
